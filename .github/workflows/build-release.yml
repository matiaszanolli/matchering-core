name: Build Release Binaries

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - 'auralis/version.py'
      - 'auralis/__version__.py'
      - 'auralis-web/backend/routers/health.py'
      - 'auralis-web/frontend/package.json'
      - 'desktop/package.json'
      - 'package.json'
      - 'pyproject.toml'
      - 'scripts/validate_release_metadata.py'
      - 'tests/validation/test_release_version_consistency.py'
      - '.github/workflows/build-release.yml'
  pull_request:
    paths:
      - 'auralis/version.py'
      - 'auralis/__version__.py'
      - 'auralis-web/backend/routers/health.py'
      - 'auralis-web/frontend/package.json'
      - 'desktop/package.json'
      - 'package.json'
      - 'pyproject.toml'
      - 'scripts/validate_release_metadata.py'
      - 'tests/validation/test_release_version_consistency.py'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.5.1 or 1.5.1-rc.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Validate requested version and repository metadata
        id: get_version
        env:
          RELEASE_INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$RELEASE_INPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Push/PR runs are a cheap metadata preflight. The cross-platform
            # binary jobs below remain limited to manual dispatches and tags.
            VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          fi

          python scripts/validate_release_metadata.py --expected "$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Building version: $VERSION"

  build-linux:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            auralis-web/frontend/pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        # #4531: dtolnay/rust-toolchain@stable ignores rust-toolchain.toml and
        # floats on whatever "stable" resolves to that day. Read the pin here
        # so the action installs the exact version the lockfile was built
        # against, instead of drifting independently of it.
        run: |
          version=$(grep -m1 '^channel' vendor/auralis-dsp/rust-toolchain.toml | cut -d '"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-14
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.version }}

      - name: Assert Linux x64 runner
        run: test "$(uname -m)" = "x86_64"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            libasound2-dev \
            libffi-dev \
            libportaudio2 \
            libsndfile1 \
            portaudio19-dev
          flatpak remote-add --user --if-not-exists \
            flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel maturin
          # #4871: install the hash-locked file, not requirements.txt. The
          # manifest pins direct dependencies only, so `pip install -r
          # requirements.txt` still resolved every TRANSITIVE afresh at build
          # time — each release shipped whatever satisfied the ranges that day,
          # unverified by any CI run. --require-hashes makes the shipped set
          # byte-identical to what backend-tests.yml tested.
          pip install --require-hashes -r requirements-lock.txt

      - name: Build Rust DSP module
        run: |
          cd vendor/auralis-dsp
          maturin build --release --locked
          pip install target/wheels/*.whl
        env:
          # pyo3 0.23's abi3 feature caps at Python 3.13; this opts into
          # trusting it against 3.14 (matches the last known-working workflow).
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

      - name: Assert Rust DSP module built against the limited API (#4911)
        # PYO3_USE_ABI3_FORWARD_COMPATIBILITY silently compiles pyo3-ffi
        # against Py_LIMITED_API with no abi3 floor pinned in Cargo.toml. If a
        # future toolchain/pyo3 change makes that stop happening, the release
        # wheel would silently flip ABI shape with no signal. Fail loudly
        # instead of shipping that unnoticed.
        run: |
          out=$(find vendor/auralis-dsp/target/release/build/pyo3-ffi-*/output)
          test -n "$out" || { echo "::error::no pyo3-ffi build script output found"; exit 1; }
          grep -q 'Py_LIMITED_API' "$out" || {
            echo "::error::expected Py_LIMITED_API in $out — abi3 forward-compat build no longer producing a limited-API wheel"
            exit 1
          }

      - name: Build frontend
        run: |
          cd auralis-web/frontend
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Prepare desktop resources (frontend + auralis core)
        run: |
          mkdir -p desktop/resources/frontend desktop/resources/auralis
          rsync -a --delete auralis-web/frontend/dist/ desktop/resources/frontend/
          rsync -a --delete auralis/ desktop/resources/auralis/ \
            --exclude='__pycache__' --exclude='*.pyc'

      - name: Build backend with PyInstaller
        run: |
          pip install pyinstaller
          cd auralis-web/backend
          pyinstaller --clean --noconfirm auralis-backend.spec

      - name: Copy backend executable into desktop resources
        run: |
          mkdir -p desktop/resources/backend
          cp auralis-web/backend/dist/auralis-backend desktop/resources/backend/
          file desktop/resources/backend/auralis-backend
          file desktop/resources/backend/auralis-backend | grep -Eq 'x86-64|x86_64'

      - name: Install desktop dependencies
        run: |
          cd desktop
          pnpm install --frozen-lockfile

      - name: Build Electron app (Linux AppImage and deb)
        run: |
          cd desktop
          pnpm run build:linux

      - name: Verify Linux AppImage and deb
        run: |
          test -f "dist/Auralis-${RELEASE_VERSION}.AppImage"
          test -f "dist/auralis-desktop_${RELEASE_VERSION}_amd64.deb"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-binaries
          path: |
            dist/Auralis-${{ needs.prepare.outputs.version }}.AppImage
            dist/auralis-desktop_${{ needs.prepare.outputs.version }}_amd64.deb
          retention-days: 30
          if-no-files-found: error

      - name: Build Electron app (Linux, Flatpak)
        run: |
          cd desktop
          pnpm run build:linux:flatpak

      - name: Verify Linux Flatpak
        run: |
          shopt -s nullglob
          flatpaks=(dist/*.flatpak)
          test "${#flatpaks[@]}" -eq 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-flatpak
          path: dist/*.flatpak
          retention-days: 30
          if-no-files-found: error

  build-windows:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            auralis-web/frontend/pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        # #4531: dtolnay/rust-toolchain@stable ignores rust-toolchain.toml and
        # floats on whatever "stable" resolves to that day. Read the pin here
        # so the action installs the exact version the lockfile was built
        # against, instead of drifting independently of it.
        run: |
          version=$(grep -m1 '^channel' vendor/auralis-dsp/rust-toolchain.toml | cut -d '"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-14
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.version }}

      - name: Assert Windows x64 runner
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            throw "Expected an AMD64 runner, got $env:PROCESSOR_ARCHITECTURE"
          }

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel maturin
          # #4871: install the hash-locked file, not requirements.txt. The
          # manifest pins direct dependencies only, so `pip install -r
          # requirements.txt` still resolved every TRANSITIVE afresh at build
          # time — each release shipped whatever satisfied the ranges that day,
          # unverified by any CI run. --require-hashes makes the shipped set
          # byte-identical to what backend-tests.yml tested.
          pip install --require-hashes -r requirements-lock.txt

      - name: Build Rust DSP module
        shell: pwsh
        run: |
          cd vendor/auralis-dsp
          maturin build --release --locked
          $wheel = Get-ChildItem target/wheels/*.whl | Select-Object -First 1
          pip install $wheel.FullName
        env:
          # pyo3 0.23's abi3 feature caps at Python 3.13; this opts into
          # trusting it against 3.14 (matches the last known-working workflow).
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

      - name: Assert Rust DSP module built against the limited API (#4911)
        # PYO3_USE_ABI3_FORWARD_COMPATIBILITY silently compiles pyo3-ffi
        # against Py_LIMITED_API with no abi3 floor pinned in Cargo.toml. If a
        # future toolchain/pyo3 change makes that stop happening, the release
        # wheel would silently flip ABI shape with no signal. Fail loudly
        # instead of shipping that unnoticed.
        shell: pwsh
        run: |
          $out = Get-ChildItem vendor/auralis-dsp/target/release/build/pyo3-ffi-*/output -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $out) { throw "no pyo3-ffi build script output found" }
          if (-not (Select-String -Path $out -Pattern 'Py_LIMITED_API' -Quiet)) {
            throw "expected Py_LIMITED_API in $out — abi3 forward-compat build no longer producing a limited-API wheel"
          }

      - name: Build frontend
        run: |
          cd auralis-web/frontend
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Prepare desktop resources (frontend + auralis core)
        shell: pwsh
        run: |
          # Sync frontend
          if (Test-Path desktop/resources/frontend) { Remove-Item -Recurse -Force desktop/resources/frontend }
          Copy-Item -Recurse auralis-web/frontend/dist desktop/resources/frontend

          # Sync auralis core
          if (Test-Path desktop/resources/auralis) { Remove-Item -Recurse -Force desktop/resources/auralis }
          Copy-Item -Recurse auralis desktop/resources/auralis
          Get-ChildItem -Recurse desktop/resources/auralis -Include __pycache__,*.pyc | Remove-Item -Recurse -Force

      - name: Build backend with PyInstaller
        shell: pwsh
        run: |
          pip install pyinstaller
          Set-Location auralis-web/backend
          pyinstaller --clean --noconfirm auralis-backend.spec

      - name: Copy backend executable into desktop resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/resources/backend
          Copy-Item -Force auralis-web/backend/dist/auralis-backend.exe desktop/resources/backend/
          if (!(Test-Path desktop/resources/backend/auralis-backend.exe)) {
            throw "Missing packaged Windows backend"
          }

      - name: Build Electron app (Windows)
        run: |
          cd desktop
          pnpm install --frozen-lockfile
          pnpm run build:win

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installer = "dist/Auralis Setup $env:RELEASE_VERSION.exe"
          if (!(Test-Path $installer)) {
            throw "Missing Windows installer: $installer"
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-binaries
          path: |
            dist/Auralis Setup ${{ needs.prepare.outputs.version }}.exe
          retention-days: 30
          if-no-files-found: error

  build-macos:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            auralis-web/frontend/pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        # #4531: dtolnay/rust-toolchain@stable ignores rust-toolchain.toml and
        # floats on whatever "stable" resolves to that day. Read the pin here
        # so the action installs the exact version the lockfile was built
        # against, instead of drifting independently of it.
        run: |
          version=$(grep -m1 '^channel' vendor/auralis-dsp/rust-toolchain.toml | cut -d '"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-14
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.version }}

      - name: Assert Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install system dependencies
        run: brew install protobuf libsndfile portaudio

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel maturin
          # #4871: install the hash-locked file, not requirements.txt. The
          # manifest pins direct dependencies only, so `pip install -r
          # requirements.txt` still resolved every TRANSITIVE afresh at build
          # time — each release shipped whatever satisfied the ranges that day,
          # unverified by any CI run. --require-hashes makes the shipped set
          # byte-identical to what backend-tests.yml tested.
          pip install --require-hashes -r requirements-lock.txt

      - name: Build Rust DSP module
        run: |
          cd vendor/auralis-dsp
          maturin build --release --locked
          pip install target/wheels/*.whl
        env:
          # pyo3 0.23's abi3 feature caps at Python 3.13; this opts into
          # trusting it against 3.14 (matches the last known-working workflow).
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

      - name: Assert Rust DSP module built against the limited API (#4911)
        # PYO3_USE_ABI3_FORWARD_COMPATIBILITY silently compiles pyo3-ffi
        # against Py_LIMITED_API with no abi3 floor pinned in Cargo.toml. If a
        # future toolchain/pyo3 change makes that stop happening, the release
        # wheel would silently flip ABI shape with no signal. Fail loudly
        # instead of shipping that unnoticed.
        run: |
          out=$(find vendor/auralis-dsp/target/release/build/pyo3-ffi-*/output)
          test -n "$out" || { echo "::error::no pyo3-ffi build script output found"; exit 1; }
          grep -q 'Py_LIMITED_API' "$out" || {
            echo "::error::expected Py_LIMITED_API in $out — abi3 forward-compat build no longer producing a limited-API wheel"
            exit 1
          }

      - name: Build frontend
        run: |
          cd auralis-web/frontend
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Prepare desktop resources (frontend + auralis core)
        run: |
          mkdir -p desktop/resources/frontend desktop/resources/auralis
          rsync -a --delete auralis-web/frontend/dist/ desktop/resources/frontend/
          rsync -a --delete auralis/ desktop/resources/auralis/ \
            --exclude='__pycache__' --exclude='*.pyc'

      - name: Build backend with PyInstaller
        run: |
          pip install pyinstaller
          cd auralis-web/backend
          pyinstaller --clean --noconfirm auralis-backend.spec

      - name: Copy backend executable into desktop resources
        run: |
          mkdir -p desktop/resources/backend
          cp auralis-web/backend/dist/auralis-backend desktop/resources/backend/
          file desktop/resources/backend/auralis-backend
          file desktop/resources/backend/auralis-backend | grep -q arm64

      - name: Build Electron app (macOS Apple Silicon)
        run: |
          cd desktop
          pnpm install --frozen-lockfile
          pnpm run build:mac:arm64

      - name: Verify Apple Silicon application and DMG
        run: |
          test -f "dist/Auralis-${RELEASE_VERSION}-arm64.dmg"
          file "dist/mac-arm64/Auralis.app/Contents/MacOS/Auralis"
          file "dist/mac-arm64/Auralis.app/Contents/MacOS/Auralis" | grep -q arm64
          file "dist/mac-arm64/Auralis.app/Contents/Resources/backend/auralis-backend"
          file "dist/mac-arm64/Auralis.app/Contents/Resources/backend/auralis-backend" | grep -q arm64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64-binary
          path: dist/Auralis-${{ needs.prepare.outputs.version }}-arm64.dmg
          retention-days: 30
          if-no-files-found: error

  create-release:
    needs: [prepare, build-linux, build-windows, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Verify release artifacts and generate checksums
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -f "artifacts/Auralis-${RELEASE_VERSION}.AppImage"
          test -f "artifacts/auralis-desktop_${RELEASE_VERSION}_amd64.deb"
          test -f "artifacts/Auralis Setup ${RELEASE_VERSION}.exe"
          test -f "artifacts/Auralis-${RELEASE_VERSION}-arm64.dmg"

          shopt -s nullglob
          flatpaks=(artifacts/*.flatpak)
          test "${#flatpaks[@]}" -eq 1

          cd artifacts
          sha256sum -- *.AppImage *.deb *.flatpak *.exe *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Check GPG signing key is configured
        # `secrets` can't be referenced directly in a step `if:` — GitHub Actions
        # has no `hashFiles`-style existence check for it, so route the presence
        # check through an env var + $GITHUB_OUTPUT instead (the documented
        # workaround).
        id: gpg_check
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$RELEASE_GPG_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GPG-sign checksums
        # #4905: the release binaries are unsigned (no Authenticode/Developer ID
        # cert yet — tracked separately, needs real certificates + an Apple
        # Developer account before it can be fixed for real). Until then,
        # SHA256SUMS.txt is generated by the same CI job it's meant to verify
        # and is not a trust anchor on its own. Detached-signing it with a key
        # whose fingerprint is published out-of-band (README.md) gives users
        # and the updater a provenance check independent of this pipeline.
        #
        # Skips gracefully (with a warning) until RELEASE_GPG_PRIVATE_KEY is
        # provisioned as a repo secret — see README.md's Release Verification
        # section for the fingerprint-publication step this depends on.
        if: steps.gpg_check.outputs.configured == 'true'
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          echo "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$RELEASE_GPG_PASSPHRASE" \
            --detach-sign --armor -o artifacts/SHA256SUMS.txt.asc artifacts/SHA256SUMS.txt
          gpg --verify artifacts/SHA256SUMS.txt.asc artifacts/SHA256SUMS.txt

      - name: Warn if checksums are unsigned
        if: steps.gpg_check.outputs.configured == 'false'
        run: |
          echo "::warning::RELEASE_GPG_PRIVATE_KEY is not set — SHA256SUMS.txt is being published unsigned. See README.md Release Verification (#4905)."

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Auralis v${{ needs.prepare.outputs.version }}
          draft: true
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # The checksum signature is optional until the repository signing
          # key is provisioned. Every file in this directory came from one of
          # the explicitly verified build artifacts above, plus the generated
          # checksum and optional signature.
          files: artifacts/*
