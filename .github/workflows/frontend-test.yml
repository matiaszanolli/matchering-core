name: Frontend Tests

# Gate added for #4640. Nothing in CI ever invoked vitest — the only frontend
# job was `frontend-typecheck.yml` — so the 214-file suite ran only when a
# developer remembered to, and a large pre-existing failure baseline
# accumulated unnoticed. This is the second half of the #4143 fix, applied to
# tests instead of types.
#
# Ratchet, not a green-suite demand: `scripts/check-test-baseline.mjs` compares
# the run against the checked-in `test-baseline.json` and fails only on
# failures that are NOT already known. The baseline can shrink but never grow.
# Once it reaches zero, replace the baseline step with a plain
# `pnpm run test:run` and re-enable the coverage thresholds that were removed
# from `vitest.config.ts` in the same change.

on:
  push:
    branches: [master]
    paths:
      - 'auralis-web/frontend/**'
      - '.github/workflows/frontend-test.yml'
  pull_request:
    paths:
      - 'auralis-web/frontend/**'
      - '.github/workflows/frontend-test.yml'

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    # The suite takes a few minutes locally; the cap exists so a spec that
    # hangs the runner fails the job instead of burning the whole allowance.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: auralis-web/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` key on purpose. Every package.json in the repo carries
      # `packageManager: pnpm@10.20.0`, and action-setup hard-errors with
      # "Multiple versions of pnpm specified" when a `version:` input is given
      # as well — which is what made every run of this workflow fail in ~13 s,
      # before it ever installed anything or ran a test. Letting the action read
      # `packageManager` keeps CI and local pnpm on one pinned version.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: auralis-web/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs under the documented 2GB heap (the suite OOMs at Node's default)
      # and always exits 0 — a failing suite is expected while the baseline is
      # non-empty. The baseline check below is what decides the job.
      - name: Run vitest
        run: pnpm run test:ci || true

      # Fails the job on any failure not present in test-baseline.json, and
      # also fails if the JSON report is missing or reports 0 collected tests,
      # so a crashed runner cannot pass as green.
      - name: Compare against known-failure baseline
        run: pnpm run test:baseline

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-results
          path: auralis-web/frontend/test-results/
          retention-days: 7
